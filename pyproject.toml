[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowstate-mcp"
version = "0.1.3"
description = "A local MCP server for persistent business-workflow and state analysis during authorized web security testing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "defusedxml>=0.7.1",
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["flowstate*"]
